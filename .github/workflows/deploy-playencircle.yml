name: Deploy Encircle to playencircle.com (beta)

on:
  push:
    branches:
      - beta/5x6-circles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Configure SSH
        env:
          DH_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DH_HOST: ${{ secrets.DREAMHOST_HOST }}
          DH_USER: ${{ secrets.DREAMHOST_USER }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/encircle-deploy
          echo "$DH_SSH_KEY" > /tmp/encircle-deploy/key
          chmod 600 /tmp/encircle-deploy/key

          mkdir -p "$HOME/.ssh"
          cp /tmp/encircle-deploy/key "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          rm -f "$HOME/.ssh/known_hosts"
          ssh-keyscan -H "$DH_HOST" >> "$HOME/.ssh/known_hosts"

          : > /tmp/encircle-deploy/cache-headers.htaccess
          cat > /tmp/encircle-deploy/cache-headers.htaccess <<'HTEOF'
          <IfModule mod_headers.c>
            <Files "index.html">
              Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
              Header set Pragma "no-cache"
              Header set Expires "Thu, 01 Jan 1970 00:00:00 GMT"
            </Files>
            <FilesMatch "\\.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf|woff|eot)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          HTEOF

      - name: Deploy to DreamHost
        env:
          DH_USER: ${{ secrets.DREAMHOST_USER }}
          DH_HOST: ${{ secrets.DREAMHOST_HOST }}
        run: |
          set -euo pipefail

          targets="domains/playencircle.com domains/playencircle.com/public domains/playencircle.com/public_html \
          playencircle.com playencircle.com/public playencircle.com/public_html public_html/playencircle.com public_html/playencircle.com/public"

          SSH_OPTS="-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=30 -i $HOME/.ssh/deploy_key"
          if [ -z "${DH_USER:-}" ] || [ -z "${DH_HOST:-}" ]; then
            echo "Missing deploy host/user secrets" >&2
            exit 1
          fi

          REMOTE_CANDIDATES="$DH_USER@$DH_HOST dh_cwxxe8@$DH_HOST dh_wy8a2d@$DH_HOST $DH_USER@pdx1-shared-a1-37.dreamhost.com dh_cwxxe8@pdx1-shared-a1-37.dreamhost.com dh_wy8a2d@pdx1-shared-a1-37.dreamhost.com"
          REMOTE=""

          for candidate in $REMOTE_CANDIDATES; do
            if ssh $SSH_OPTS "$candidate" "echo AUTH_OK"; then
              REMOTE="$candidate"
              break
            else
              echo "SSH auth failed for $candidate"
            fi
          done

          if [ -z "$REMOTE" ]; then
            echo "Could not authenticate to DreamHost. Check DREAMHOST_HOST and DREAMHOST_USER secrets and the SSH key." >&2
            exit 1
          fi

          echo "Deploying with remote: $REMOTE"

          for target in $targets; do
            echo "Deploying to: $target"
            rsync -avz --delete --exclude='.DS_Store' -e "ssh $SSH_OPTS" public/ "$REMOTE:$target/"
            rsync -avz --delete -e "ssh $SSH_OPTS" /tmp/encircle-deploy/cache-headers.htaccess "$REMOTE:$target/.htaccess"
            ssh $SSH_OPTS "$REMOTE" "printf '%s\n' '$target' > '$target/encircle-deploy-root.txt'"
          done
