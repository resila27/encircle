name: Deploy Encircle to playencircle.com (beta)

on:
  push:
    branches:
      - beta/5x6-circles
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

 - name: Set up Node.js
  uses: actions/setup-node@v4
  with:
    node-version: '22'

- name: Install pnpm
  run: npm install -g pnpm@latest

- name: Install dependencies
  run: |
    pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to DreamHost
        env:
          DH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DH_HOST: ${{ secrets.DREAMHOST_HOST }}
          DH_USER: ${{ secrets.DREAMHOST_USER }}
        run: |
          mkdir -p /tmp/encircle-deploy
          echo "$DH_KEY" > /tmp/encircle-deploy/key
          chmod 600 /tmp/encircle-deploy/key
          mkdir -p "$HOME/.ssh"
          cp /tmp/encircle-deploy/key "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$DH_HOST" >> "$HOME/.ssh/known_hosts"

          echo '<IfModule mod_headers.c>\n<Files "index.html">\nHeader set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"\nHeader set Pragma "no-cache"\nHeader set Expires "Thu, 01 Jan 1970 00:00:00 GMT"\n</Files>\n<FilesMatch "\\.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf|woff|eot)$">\nHeader set Cache-Control "public, max-age=31536000, immutable"\n</FilesMatch>\n</IfModule>' > /tmp/encircle-deploy/headers.htaccess

          targets="domains/playencircle.com domains/playencircle.com/public domains/playencircle.com/public_html playencircle.com playencircle.com/public playencircle.com/public_html public_html/playencircle.com public_html/playencircle.com/public"
          SSH_OPTS="-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -i $HOME/.ssh/deploy_key"
          REMOTE="$DH_USER@$DH_HOST"

          for target in $targets; do
            rsync -avz --delete --exclude='.DS_Store' -e "ssh $SSH_OPTS" public/ "$REMOTE:$target/"
            rsync -avz --delete -e "ssh $SSH_OPTS" /tmp/encircle-deploy/headers.htaccess "$REMOTE:$target/.htaccess"
          done

          ssh $SSH_OPTS "$REMOTE" "printf '%s\n' \"$targets\" > playencircle.com/encircle-deploy-root.txt"
