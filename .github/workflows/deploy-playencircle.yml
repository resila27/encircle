name: Deploy Encircle to playencircle.com (beta)

on:
  push:
    branches:
      - beta/5x6-circles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Configure SSH
        env:
          DH_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DH_HOST: ${{ secrets.DREAMHOST_HOST }}
          DH_USER: ${{ secrets.DREAMHOST_USER }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/encircle-deploy
          echo "$DH_SSH_KEY" > /tmp/encircle-deploy/key
          chmod 600 /tmp/encircle-deploy/key

          mkdir -p "$HOME/.ssh"
          cp /tmp/encircle-deploy/key "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          rm -f "$HOME/.ssh/known_hosts"
          ssh-keyscan -H "$DH_HOST" >> "$HOME/.ssh/known_hosts"

          : > /tmp/encircle-deploy/cache-headers.htaccess
          cat > /tmp/encircle-deploy/cache-headers.htaccess <<'HTEOF'
          <IfModule mod_headers.c>
            <Files "index.html">
              Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
              Header set Pragma "no-cache"
              Header set Expires "Thu, 01 Jan 1970 00:00:00 GMT"
            </Files>
            <FilesMatch "\\.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf|woff|eot)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          HTEOF

      - name: Deploy to DreamHost
        env:
          DH_USER: ${{ secrets.DREAMHOST_USER }}
          DH_HOST: ${{ secrets.DREAMHOST_HOST }}
        run: |
          set -uo pipefail
          # Deliberately not "set -e" for this step — see the loop below. We don't know for certain
          # which of these candidate paths is the real document root for this DreamHost account, so
          # this writes to all of them defensively. With "set -e" (the previous behavior), the FIRST
          # candidate that doesn't exist on this account (e.g. no public_html/ folder at all) aborted
          # the whole script immediately via a hard exit — even after every real target had already
          # deployed successfully. That's exactly why every run here has shown red X since Aug 10: the
          # site was in fact updating correctly the whole time, this step just reported failure once it
          # hit a candidate path that doesn't apply to this account. The job now only fails for real if
          # every single candidate fails.

          # We now know for certain (confirmed via the encircle-deploy-root.txt marker actually being
          # served live at https://playencircle.com/encircle-deploy-root.txt) that the real docroot on
          # this account is the bare "playencircle.com" folder. Deliberately NOT shotgunning multiple
          # candidate paths anymore: several of the old guesses (bare "domains/playencircle.com" and
          # "playencircle.com" style parents) sync with --delete, and if guessed wrong they'd silently
          # wipe out anything sitting in that folder that isn't part of this build (including
          # gridlock-config.php, which lives outside the deployed folder). One confirmed-correct target
          # is both simpler and much safer than guessing across eight.
          targets="playencircle.com"

          SSH_OPTS="-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=30 -i $HOME/.ssh/deploy_key"

          if [ -n "${DH_USER:-}" ] && [ -n "${DH_HOST:-}" ]; then
            REMOTE_CANDIDATES="$DH_USER@$DH_HOST"
          else
            REMOTE_CANDIDATES=""
          fi

          REMOTE_CANDIDATES="$REMOTE_CANDIDATES dh_cwxxe8@pdx1-shared-a1-37.dreamhost.com dh_wy8a2d@pdx1-shared-a1-37.dreamhost.com"
          REMOTE=""

          for candidate in $REMOTE_CANDIDATES; do
            echo "Testing SSH access for $candidate"
            if ssh $SSH_OPTS "$candidate" "echo AUTH_OK"; then
              REMOTE="$candidate"
              break
            else
              echo "SSH auth failed for $candidate"
            fi
          done

          if [ -z "$REMOTE" ]; then
            echo "Could not authenticate to DreamHost. Verify:"
            echo " - DREAMHOST_USER and DREAMHOST_HOST secrets"
            echo " - DREAMHOST_SSH_KEY matches authorized key on DreamHost"
            exit 1
          fi

          echo "Deploying to: $REMOTE"

          success_count=0
          for target in $targets; do
            echo "Copying files to: $target"
            if rsync -avz --delete --exclude='.DS_Store' -e "ssh $SSH_OPTS" public/ "$REMOTE:$target/" \
              && rsync -avz --delete -e "ssh $SSH_OPTS" /tmp/encircle-deploy/cache-headers.htaccess "$REMOTE:$target/.htaccess" \
              && ssh $SSH_OPTS "$REMOTE" "printf '%s\n' \"$target\" > \"$target/encircle-deploy-root.txt\""; then
              echo "Deployed OK to $target"
              success_count=$((success_count + 1))
            else
              echo "Skipping $target — not a valid path on this account, that's expected for most of these guesses"
            fi
          done

          echo "Deployed successfully to $success_count candidate path(s)."
          if [ "$success_count" -eq 0 ]; then
            echo "Every candidate deploy path failed — nothing was actually deployed."
            exit 1
          fi
